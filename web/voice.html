<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开麦对话 · movieagent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=kawaii1" />
  <link rel="stylesheet" href="/static/kawaii.css?v=cursor-fold1" />
</head>
<body class="voice-body kawaii chat-app">
  <header class="kawaii-nav">
    <a class="brand" href="/voice">
      <span class="brand-badge">MA</span>
      <strong>Movieagent</strong>
      <span class="heart" aria-hidden="true">♡</span>
    </a>
  </header>

  <main class="chat-shell">
    <div class="chat-scroll">
      <div class="empty-hero" id="emptyHero">
        <p class="hello">视频设计工作室 <span>♡</span></p>
        <h1 class="voice-title">想说点什么？</h1>
        <p class="roles">文字输入 · 开麦转写 · Agent 执行</p>
      </div>
      <section class="chat-board" id="chatBoard" hidden>
        <div class="chat-thread" id="chatThread" aria-live="polite"></div>
      </section>
    </div>

    <div class="composer-wrap">
      <div class="picker-pop" id="agentPicker" hidden>
        <div class="picker-label">Agent</div>
        <div class="agent-filters" id="agentFilters" role="listbox" aria-label="选择 Agent"></div>
        <div class="picker-label">Skill</div>
        <div class="agent-filters skill-filters" id="skillFilters" role="listbox" aria-label="选择 Skill"></div>
      </div>
      <form class="composer dock-composer" id="composer">
        <button class="plus-btn" id="btnPlus" type="button" aria-label="选择 Agent 和 Skill" aria-expanded="false">+</button>
        <input
          id="query"
          class="query"
          type="text"
          placeholder="输入文字，或点右侧开麦转写"
          autocomplete="off"
          enterkeyhint="send"
        />
        <div class="composer-right">
          <span class="mode-tag active">快速</span>
          <span class="mode-tag">进阶</span>
          <span class="composer-dot" id="composerDot" aria-hidden="true"></span>
          <button class="orb-btn" id="btnAsk" type="button" aria-pressed="false" aria-label="开麦转写">
            <span class="orb-icon mic" data-role="icon-mic" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 3a4 4 0 0 0-4 4v4a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="orb-icon send" data-role="icon-send" hidden aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h12M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="orb-icon stop" data-role="icon-stop" hidden aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </span>
            <span class="ask-text" hidden>开麦转写</span>
          </button>
        </div>
      </form>
      <p class="composer-hint" id="hint"></p>
    </div>

    <section class="agent-result" id="agentResult" hidden>
      <div class="result-head">
        <span class="transcript-label" id="resultLabel">Agent 结果</span>
        <span class="result-prompt" id="resultPrompt"></span>
      </div>
      <ol class="steps" id="resultSteps"></ol>
      <div class="result-stage">
        <figure class="result-frame" id="resultFrame">
          <img id="resultImage" alt="Agent 输出图片" hidden />
          <p class="empty" id="resultEmpty">结果会出现在这里</p>
        </figure>
        <aside class="result-brief">
          <h2>输出</h2>
          <pre id="resultText">等待执行</pre>
        </aside>
      </div>
    </section>

    <section class="status-card" id="statusCard" hidden>
      <div class="row">
        <span class="dot" id="dot"></span>
        <strong id="listenState">未开麦</strong>
        <span class="latency" id="latencyText">延迟 —</span>
      </div>
      <div class="meter"><i id="meterBar"></i></div>
      <ul class="log" id="eventLog"></ul>
    </section>
  </main>

  <script src="/static/voice.js?v=cursor-fold1"></script>
</body>
</html>
