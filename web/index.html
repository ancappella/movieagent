<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>品牌 Agent · 海报执行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <nav class="site-nav" aria-label="模块">
    <a class="active" href="/">海报工作室</a>
    <a href="/voice">开麦对话</a>
  </nav>
  <header class="top">
    <div class="mark">
      <span class="mark-dot" aria-hidden="true"></span>
      <div>
        <strong>品牌 Agent</strong>
        <span>海报工作流</span>
      </div>
    </div>
    <p class="hint">创意 → 出图 → 品牌整合</p>
  </header>

  <main class="layout">
    <section class="panel input" aria-label="任务">
      <label class="field">
        <span>需求</span>
        <textarea id="prompt" rows="5" placeholder="例如：为中秋节柠檬茶新品做一张竖版海报"></textarea>
      </label>

      <div class="field">
        <span>产品图</span>
        <button type="button" class="drop" id="dropzone">
          <img id="preview" alt="" hidden />
          <span id="drop-label">点击或拖入产品图，可选</span>
        </button>
        <input id="file-input" type="file" accept="image/*" hidden />
      </div>

      <div class="field">
        <span>元素</span>
        <ul class="elements" id="elements"></ul>
        <button type="button" class="add-element" id="btn-element">添加元素</button>
        <input id="element-input" type="file" accept="image/*" hidden multiple />
      </div>
      <label class="field">
        <span>品牌</span>
        <select id="brand" aria-label="品牌">
          <option value="">不使用品牌 Logo</option>
        </select>
      </label>

      <div class="row">
        <button type="button" class="ghost" id="btn-demo">填入中秋示例</button>
        <button type="button" class="run" id="btn-send">生成海报</button>
      </div>
      <p class="status" id="status" role="status">就绪</p>
    </section>

    <section class="panel output" aria-label="执行与结果">
      <ol class="steps" id="steps"></ol>
      <div class="stage">
        <figure class="frame" id="frame">
          <img id="result-image" alt="生成的品牌海报" hidden />
          <p class="empty" id="empty">海报会出现在这里</p>
        </figure>
        <aside class="brief">
          <h2>创意内容输出</h2>
          <pre id="creative">等待执行</pre>
          <p class="path" id="path"></p>
        </aside>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
